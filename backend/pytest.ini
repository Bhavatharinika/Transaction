[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
pythonpath = . .. ../load-tests load-tests
markers =
    integration: needs PostgreSQL and Redis (TEST_DATABASE_URL / TEST_REDIS_URL)
    mock_service: needs the real mock posting service (MOCK_SERVICE_URL)
